services:
  - type: web
    name: campus-connect-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: MONGODB_URI
        scope: build
      - key: JWT_SECRET
        scope: build
      - key: CLOUDINARY_NAME
        scope: build
      - key: CLOUDINARY_API_KEY
        scope: build
      - key: CLOUDINARY_API_SECRET
        scope: build
      - key: SMTP_SERVICE
        scope: build
      - key: SMTP_EMAIL
        scope: build
      - key: SMTP_PASSWORD
        scope: build
      - key: PORT
        value: 5000

  - type: web
    name: campus-connect-frontend
    runtime: node
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npm run preview
    envVars:
      - key: VITE_API_URL
        value: https://campus-connect-backend.onrender.com/api
